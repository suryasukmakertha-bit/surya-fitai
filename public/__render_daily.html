<!DOCTYPE html><html><head><style>body{margin:0;background:repeating-conic-gradient(#2a2a2a 0% 25%,#383838 0% 50%) 50% / 24px 24px;padding:40px;color:#fff;font-family:sans-serif;}</style></head>
<body><div id="out"></div><pre id="log" style="color:#ff8c3d;font-size:11px;"></pre><script type="module">
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
window.addEventListener('error', e => log('ERR: ' + e.message));
const opts = {
  dayLabel: "2026-06-20",
  exercises: [
    {name:"Barbell Bench Press",sets:"4",reps:"8",rest:"90s"},
    {name:"Seated Dumbbell Press",sets:"3",reps:"10",rest:"60s"},
    {name:"Cable Crossover",sets:"3",reps:"12",rest:"60s"},
    {name:"Lateral Raise (Dumbbell)",sets:"3",reps:"15",rest:"45s"},
    {name:"Tricep Pushdown (Cable)",sets:"3",reps:"12",rest:"60s"},
    {name:"Forearm Plank",sets:"3",reps:"45s",rest:"30s"},
  ],
  completedExercises: ["Barbell Bench Press","Seated Dumbbell Press","Cable Crossover","Lateral Raise (Dumbbell)","Tricep Pushdown (Cable)","Forearm Plank"],
  totalExercises: 6,
  planMonthNumber: 2,
  lang: "en",
};
const origCreate = document.createElement.bind(document);
let theCanvas;
document.createElement = (t) => { const e = origCreate(t); if(t==='canvas'){theCanvas=e;} return e; };
HTMLAnchorElement.prototype.click = function(){ document.getElementById('out').appendChild(theCanvas); theCanvas.style.width='360px'; log('canvas size '+theCanvas.width+'x'+theCanvas.height); };
const bust = Date.now() + '-' + Math.random();
import('/src/lib/dailyProgressDownload.ts?b=' + bust).then(m=>{ log('module loaded'); m.downloadDailyProgress(opts); log('rendered'); }).catch(e=>log('IMPORT ERR: '+e.message));
</script></body></html>
